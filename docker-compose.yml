# Sobe tudo com: docker compose up -d
# API em http://localhost:8090/api/v1 e documentação em http://localhost:8090/docs

name: arquiva

x-app: &app
  build: .
  image: arquiva-app
  volumes:
    - .:/var/www/html
  environment:
    DB_HOST: postgres
    DB_DATABASE: arquiva
    DB_USERNAME: arquiva
    DB_PASSWORD: arquiva
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    entrypoint: ["arquiva-entrypoint"]
    command: ["php-fpm"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${ARQUIVA_PORT:-8090}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: ["sh", "-c", "until [ -f storage/app/.ready ]; do sleep 2; done; php artisan queue:work --tries=3 --sleep=2"]
    restart: unless-stopped

  scheduler:
    <<: *app
    command: ["sh", "-c", "until [ -f storage/app/.ready ]; do sleep 2; done; php artisan schedule:work"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arquiva
      POSTGRES_USER: arquiva
      POSTGRES_PASSWORD: arquiva
    ports:
      - "${ARQUIVA_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arquiva -d arquiva"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
